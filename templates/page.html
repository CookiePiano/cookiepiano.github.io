<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#ffffff">
  <script src="../assets/theme.js"></script>
  <link rel="canonical" href="{{siteUrl}}{{lang}}/">
  <link rel="alternate" hreflang="ko" href="{{siteUrl}}ko/">
  <link rel="alternate" hreflang="en" href="{{siteUrl}}en/">
  <link rel="alternate" hreflang="x-default" href="{{siteUrl}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{siteUrl}}{{lang}}/">
  <meta property="og:locale" content="{{locale}}">
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&amp;display=swap">
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body id="top">
  <a class="skip-link" href="#main">{{skipLink}}</a>
  <header class="site-header shell">
    <a class="wordmark" href="./" aria-label="{{homeLabel}}">{{name}}</a>
    <nav class="main-nav" aria-label="{{mainNavLabel}}">
      <a href="#repositories">{{navRepositories}}</a>
      <a href="{{github}}" aria-label="{{githubProfile}} @{{githubHandle}}">GitHub</a>
    </nav>
    <div class="header-tools">
      <nav class="language-nav" aria-label="{{languageNavLabel}}">{{languageNav}}</nav>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="{{darkThemeLabel}}" aria-pressed="false" hidden>
        <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/></svg>
      </button>
    </div>
  </header>
  <main id="main" class="shell" tabindex="-1">
    <section class="repositories" id="repositories" aria-labelledby="repositories-title">
      <div class="section-heading">
        <h1 id="repositories-title">{{headline}}</h1>
        <p>{{intro}}</p>
      </div>
{{projectCaption}}
      <ul class="repository-list">
{{projects}}
      </ul>
    </section>
  </main>
  <footer class="site-footer shell">
    <div class="footer-identity">
      <a class="wordmark" href="./" aria-label="{{homeLabel}}">{{name}}</a>
      <p>{{footer}}</p>
    </div>
    <nav class="footer-nav" aria-label="{{footerNavLabel}}">
      <a href="{{github}}">GitHub</a>
      <a href="../admin/">{{adminLink}}</a>
      <a href="#top">{{backToTop}}</a>
    </nav>
  </footer>
</body>
</html>
